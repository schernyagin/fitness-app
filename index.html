<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фитнес Расписание</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <div id="app">
        <!-- Экран авторизации -->
        <section id="screen-login" class="screen active">
            <h2>Вход в систему</h2>
            <div class="form-group">
                <label for="username">Ваше имя / Логин тренера:</label>
                <input type="text" id="username" placeholder="Введите имя">
            </div>
            <button id="btn-login-user">Войти как Подопечный</button>
            <button id="btn-login-coach" class="btn-secondary">Войти как Тренер</button>
        </section>

        <!-- Экран подопечного -->
        <section id="screen-client" class="screen">
            <header>
                <h2>Привет, <span id="client-name">Подопечный</span>!</h2>
                <button class="btn-logout">Выйти</button>
            </header>
            
            <div class="booking-box">
                <h3>Записаться на тренировку</h3>
                <label for="client-time-select">Выберите свободное время (сессия — 1 час):</label>
                <select id="client-time-select">
                    <!-- Сюда JS добавит только доступные опции типа 08:00, 08:30... -->
                </select>
                <button id="btn-book-client" style="margin-top: 10px;">Забронировать это время</button>
            </div>

            <h3>Ваша текущая запись:</h3>
            <div id="client-my-booking">
                <!-- Показывает, на какое время записан подопечный -->
            </div>
        </section>

        <!-- Экран тренера -->
        <section id="screen-coach" class="screen">
            <header>
                <h2>Панель тренера</h2>
                <button class="btn-logout">Выйти</button>
            </header>
            
            <h3>Занятые интервалы на сегодня:</h3>
            <div id="coach-schedule" class="schedule-list">
                <!-- Сюда JS выведет список тех, кто занял время -->
            </div>
        </section>
    </div>
    <script src="app.js"></script>

</body>
</html>
